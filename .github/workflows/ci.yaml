name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Every patch's upstream PR is still open
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=0
          for p in patches/*.patch; do
            n=$(sed -n '1s|^Upstream: https://github.com/NousResearch/hermes-agent/pull/||p' "$p")
            state=$(gh pr view "$n" -R NousResearch/hermes-agent --json state --jq .state)
            echo "$(basename "$p"): $state"
            if [ "$state" = CLOSED ]; then
              echo "::error::$(basename "$p"): the upstream PR was closed without a merge: delete the patch (see README)"
              status=1
            fi
          done
          exit $status

      - name: Build with the patches applied
        run: docker build --platform linux/amd64 -t hermes-agent-patched:ci .

      - name: Import every module the patches touch
        run: |
          modules=$(grep -h '^+++ b/' patches/*.patch | sed 's|^+++ b/||' | grep '\.py$' | grep -v '^tests/' | sed 's|\.py$||; s|/|.|g' | sort -u)
          # shellcheck disable=SC2086 # one argument per module
          docker run --rm --entrypoint /opt/hermes/.venv/bin/python -w /opt/hermes hermes-agent-patched:ci \
            -c 'import importlib, sys; [print("imported", importlib.import_module(m).__name__) for m in sys.argv[1:]]' $modules
