name: Release

on:
  push:
    branches: [main]
    paths: ["Dockerfile", "scripts/**", "patches/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Next tag from the base image and the build count
        id: tag
        run: |
          base=$(grep -oP '^FROM nousresearch/hermes-agent:\K[^@\s]+' Dockerfile)
          if [ -z "$base" ]; then
            echo "Could not parse the Hermes tag from Dockerfile" >&2
            exit 1
          fi
          if git tag --points-at HEAD | grep -q .; then
            echo "HEAD is already released; nothing to do."
            exit 0
          fi
          last=$(git tag -l "${base}-lares.*" | awk -F'-lares.' '{print $2}' | sort -n | tail -1)
          echo "tag=${base}-lares.$(( ${last:-0} + 1 ))" >> "$GITHUB_OUTPUT"
          echo "base=${base}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        if: steps.tag.outputs.tag
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata
        if: steps.tag.outputs.tag
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: type=raw,value=${{ steps.tag.outputs.tag }}

      # amd64 only: the image runs in the cluster, nowhere else.
      - name: Build and push
        if: steps.tag.outputs.tag
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Tag and GitHub release
        if: steps.tag.outputs.tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          BASE: ${{ steps.tag.outputs.base }}
        run: |
          {
            echo "Hermes ${BASE} with these open upstream PRs:"
            echo
            sed -n 's/^Upstream: /- /p' patches/*.patch
          } > notes.md
          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" --title "$TAG" --notes-file notes.md
